<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TWC MedCRM">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F3D3E'/%3E%3Ctext x='50' y='62' font-family='Arial' font-size='42' font-weight='bold' text-anchor='middle' fill='%2314B8A6'%3ETWC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F3D3E'/%3E%3Ctext x='50' y='62' font-family='Arial' font-size='42' font-weight='bold' text-anchor='middle' fill='%2314B8A6'%3ETWC%3C/text%3E%3C/svg%3E">
<title>TWC MedCRM — Healthcare CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#14B8A6; --deep:#0F3D3E; --accent:#F97362; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(circle at 30% 20%,#1a5a5a 0%,#0F3D3E 40%,#07292a 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    flex-direction:column;overflow:hidden;text-align:center;padding:24px;min-height:100vh;
  }
  .logo{
    width:96px;height:96px;border-radius:24px;
    background:linear-gradient(135deg,#14B8A6,#0F3D3E);
    border:1.5px solid rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:24px;
    animation:pulse 2.4s ease-in-out infinite;
    box-shadow:0 12px 40px -8px rgba(20,184,166,.4);
  }
  .logo-mark{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:24px;color:#fff;
    letter-spacing:-.02em;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(20,184,166,.4),0 12px 40px -8px rgba(20,184,166,.4)}
    50%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(20,184,166,0),0 12px 40px -8px rgba(20,184,166,.4)}
  }
  h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:28px;letter-spacing:-.02em;
    margin:0 0 8px;color:#fff;
  }
  p.sub{
    color:rgba(255,255,255,.75);font-size:14px;
    margin:0 0 28px;max-width:340px;line-height:1.5;
  }
  .bar{
    width:200px;height:3px;background:rgba(255,255,255,.12);
    border-radius:4px;overflow:hidden;margin:0 auto 18px;
  }
  .bar::after{
    content:'';display:block;height:100%;width:40%;
    background:linear-gradient(90deg,transparent,#14B8A6,transparent);
    animation:load 1.2s ease-in-out infinite;
  }
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #status{
    color:rgba(255,255,255,.55);font-size:12px;
    margin-bottom:22px;min-height:16px;font-weight:500;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,#14B8A6,#0D9488);
    color:#fff;border:none;border-radius:12px;
    padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'DM Sans',sans-serif;text-decoration:none;
    transition:all .18s;box-shadow:0 6px 20px -4px rgba(20,184,166,.5);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -4px rgba(20,184,166,.6)}
  .btn:active{transform:scale(.98)}
  .btn svg{width:16px;height:16px}
  .hidden{display:none !important}
  #err{
    display:none;color:#F97362;font-size:12px;
    margin-top:14px;max-width:340px;line-height:1.4;
    background:rgba(249,115,98,.1);padding:10px 14px;border-radius:8px;
    border:1px solid rgba(249,115,98,.3);
  }
  .footer-hint{
    color:rgba(255,255,255,.35);font-size:11px;margin-top:24px;
    font-weight:500;
  }
  .spinner{
    width:18px;height:18px;border:2px solid rgba(255,255,255,.2);
    border-top-color:#14B8A6;border-radius:50%;
    animation:spin .8s linear infinite;display:inline-block;
    vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:480px){
    h1{font-size:24px}
    p.sub{font-size:13px}
    .logo{width:80px;height:80px}
    .logo-mark{font-size:20px}
  }
</style>
</head>
<body>
  <div class="logo" aria-label="TWC MedCRM logo">
    <span class="logo-mark">TWC</span>
  </div>
  <h1>TWC MedCRM</h1>
  <p class="sub">Healthcare CRM · Powered by Google Workspace</p>
  <div class="bar" aria-hidden="true"></div>
  <div id="status"><span class="spinner"></span>Loading your workspace…</div>
  <a id="launch" class="btn hidden" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
    Open App
  </a>
  <div id="err"></div>
  <div class="footer-hint">Multi-tenant · NDPA-compliant · PWA-enabled</div>

<script>
/* ===== CONFIG: paste your GAS Web App URL here =====
   Find it under: GAS → Deploy → Manage deployments → Web App URL.
   Example: https://script.google.com/macros/s/AKfyc.../exec       */
var GAS_URL = "https://script.google.com/macros/s/AKfycbxl4l0pjDK0-IfsMBfXZP7KwC0PkUFOOqLjyy5VtQEZZtn_bONoendpB7xZb4XcF8kqwA/exec";

/* Register service worker for PWA installability */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('SW registration failed:', err);
    });
  });
}

(function(){
  var launchBtn = document.getElementById('launch');
  var statusEl  = document.getElementById('status');
  var errEl     = document.getElementById('err');

  /* Hide everything until GAS_URL is set */
  if(!GAS_URL || GAS_URL.indexOf('XXXXXXXX') > -1){
    statusEl.innerHTML = '';
    errEl.style.display = 'block';
    errEl.innerHTML = '<strong>Setup required:</strong> Edit this file and set <code>GAS_URL</code> to your deployed Google Apps Script Web App URL.';
    return;
  }

  launchBtn.href = GAS_URL;

  function setStatus(msg){
    statusEl.innerHTML = '<span class="spinner"></span>' + msg;
  }

  function showError(msg, showLaunch){
    statusEl.innerHTML = '';
    errEl.style.display = 'block';
    errEl.textContent = msg;
    if(showLaunch){ launchBtn.classList.remove('hidden'); }
  }

  function launchApp(){
    /* Auto-redirect to the GAS app after the splash animation.
       This works reliably across all browsers including iOS Safari
       where iframe embedding is often blocked by X-Frame-Options. */
    window.location.href = GAS_URL;
  }

  /* Try embedding in an iframe first (keeps the splash visible).
     If embedding fails or times out, fall back to a full redirect. */
  setStatus('Connecting to Google Apps Script…');

  var iframeLoaded = false;
  var iframeFailed = false;

  try {
    var f = document.createElement('iframe');
    f.src = GAS_URL;
    f.style.cssText = 'position:fixed;inset:0;border:0;width:100%;height:100%;z-index:999;background:#0F3D3E';
    f.setAttribute('allow', 'clipboard-write; camera; geolocation; fullscreen; popups');
    f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

    f.onload = function(){
      iframeLoaded = true;
      statusEl.innerHTML = '';
      document.body.style.background = '#fff';
      /* hide splash elements once app loads */
      document.querySelectorAll('.logo, h1, p.sub, .bar, #status, #err, .footer-hint, #launch')
        .forEach(function(el){ el.style.display = 'none'; });
    };

    f.onerror = function(){ iframeFailed = true; };

    document.body.appendChild(f);

    /* If the iframe doesn't signal readiness in 5s, show the Open button. */
    setTimeout(function(){
      if(!iframeLoaded){
        setStatus('Almost ready…');
        launchBtn.classList.remove('hidden');
      }
    }, 5000);

    /* If iframe embedding is blocked entirely (X-Frame-Options),
       onLoad may not fire — auto-redirect after 7s as a safety net. */
    setTimeout(function(){
      if(!iframeLoaded && !iframeFailed){
        /* Most likely blocked by X-Frame-Options — redirect. */
        launchApp();
      }
    }, 7000);

  } catch(e){
    /* Iframe creation threw — fall back to redirect. */
    console.error('iframe setup failed:', e);
    launchApp();
  }

  /* If the user taps Open App, navigate directly. */
  launchBtn.addEventListener('click', function(e){
    e.preventDefault();
    launchApp();
  });

})();
</script>
</body>
</html>
